name: Desktop release

# Builds the Tauri desktop app on all three OSes and attaches the
# installers to the existing v2.2.2 GitHub Release. Manual trigger:
# run it from the Actions tab (or `gh workflow run desktop-release.yml`)
# after the release for the tag has been created.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Generate the full icon set (adds icon.icns)
        run: |
          npm install -g @tauri-apps/cli@^2
          tauri icon desktop/src-tauri/icons/icon.png --output desktop/src-tauri/icons

      - name: Build the app and upload it to the v2.2.2 release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v2.2.2
          releaseName: "Agent Mesh v2.2.2"
          releaseBody: "Agent Mesh v2.2.2 — participant removals now propagate across nodes (tombstones), plus the first desktop app builds (Tauri shell for Windows, macOS and Linux)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
